<!DOCTYPE html>
<html lang="en" data-dj-theme="hoard">
<head>
<meta charset="UTF-8">
<title>dj-popup demo</title>
<link rel="stylesheet" href="../../brand/tokens/tokens.css">
<link rel="stylesheet" href="base.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { width: 100%; }
  body { padding: 0; box-sizing: border-box; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
  <header class="dj-head" id="head" data-state="active">
    <span class="dj-mark" aria-hidden="true"></span>
    <span class="dj-titles">
      <span class="dj-wordmark" role="img" aria-label="Djaunt"></span>
      <h1 class="dj-title">Panel title</h1>
    </span>
    <span class="dj-pill" id="pill" data-state="active">on</span>
  </header>
  <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
    <button type="button" class="dj-switch" id="switch" role="switch" aria-checked="true" aria-label="Enable">
      <span class="dj-knob"></span>
    </button>
    <div class="dj-seg-group" id="segmented" role="radiogroup" aria-label="mode">
      <button type="button" class="dj-seg" role="radio" aria-checked="true" data-value="auto">Auto</button>
      <button type="button" class="dj-seg" role="radio" aria-checked="false" data-value="on">On</button>
      <button type="button" class="dj-seg" role="radio" aria-checked="false" data-value="off">Off</button>
    </div>
    <button type="button" class="dj-btn" id="reset">Reset</button>
    <p class="dj-hint">Helper copy, <code>inline code</code> included.</p>
    <footer class="dj-foot" id="foot" role="status">Applied — mode: auto</footer>
  </div>

<script>
  const head = document.getElementById('head');
  const pill = document.getElementById('pill');
  const swtch = document.getElementById('switch');
  const segmented = document.getElementById('segmented');
  const foot = document.getElementById('foot');

  function render() {
    const on = swtch.getAttribute('aria-checked') === 'true';
    const mode = segmented.querySelector('[aria-checked="true"]').dataset.value;
    head.dataset.state = on ? 'active' : 'idle';
    pill.dataset.state = on ? 'active' : 'idle';
    pill.textContent = on ? 'on' : 'off';
    foot.textContent = on ? `Applied — mode: ${mode}` : 'Paused';
  }

  swtch.addEventListener('click', () => {
    const on = swtch.getAttribute('aria-checked') === 'true';
    swtch.setAttribute('aria-checked', String(!on));
    render();
  });

  segmented.addEventListener('click', (e) => {
    const seg = e.target.closest('.dj-seg');
    if (!seg) return;
    segmented.querySelectorAll('.dj-seg').forEach((s) => s.setAttribute('aria-checked', String(s === seg)));
    render();
  });

  document.getElementById('reset').addEventListener('click', () => {
    swtch.setAttribute('aria-checked', 'true');
    segmented.querySelectorAll('.dj-seg').forEach((s) => s.setAttribute('aria-checked', String(s.dataset.value === 'auto')));
    render();
  });
</script>
</body>
</html>
