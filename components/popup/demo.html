<!DOCTYPE html>
<html lang="en" data-dj-theme="hoard">
<head>
<meta charset="UTF-8">
<title>dj-popup demo</title>
<link rel="stylesheet" href="../../brand/tokens/tokens.css">
<link rel="stylesheet" href="base.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { width: 100%; }
  body { padding: 0; box-sizing: border-box; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
  <header class="dj-head" data-state="active">
    <span class="dj-mark" aria-hidden="true"></span>
    <span class="dj-titles">
      <span class="dj-wordmark" role="img" aria-label="Djaunt"></span>
      <h1 class="dj-title">Panel title</h1>
    </span>
    <span class="dj-pill" data-state="active">on</span>
  </header>
  <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">
    <button type="button" class="dj-switch" role="switch" aria-checked="true" aria-label="Enable">
      <span class="dj-knob"></span>
    </button>
    <div class="dj-seg-group" role="radiogroup" aria-label="mode">
      <button type="button" class="dj-seg" role="radio" aria-checked="true">Auto</button>
      <button type="button" class="dj-seg" role="radio" aria-checked="false">On</button>
      <button type="button" class="dj-seg" role="radio" aria-checked="false">Off</button>
    </div>
    <button type="button" class="dj-btn">Reset</button>
    <p class="dj-hint">Helper copy, <code>inline code</code> included.</p>
    <footer class="dj-foot" role="status">Applied</footer>
  </div>
</body>
</html>
